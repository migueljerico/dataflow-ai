name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-backend:
    name: Backend Tests (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - run: pip install --upgrade pip && pip install -r requirements.txt
      - name: Ruff lint (non-blocking)
        run: pip install ruff && ruff check app --line-length 100 || true
      - name: Black format check (non-blocking)
        run: pip install black && black --check app --line-length 100 || true
      - name: Bandit SAST (non-blocking)
        run: pip install bandit && bandit -r app -q -ll || true
      - name: Pip audit (non-blocking)
        run: pip install pip-audit && pip-audit --desc || true
      - run: pytest --tb=short -q

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint (non-blocking)
        run: npx eslint src --max-warnings=0 2>&1 || echo "eslint not configured — skipping"
      - name: Prettier check (non-blocking)
        run: npx prettier --check "src/**/*.{ts,tsx,css}" 2>&1 || echo "prettier not configured — skipping"
      - run: npx tsc --noEmit
      - run: npm run build

  gitleaks:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: dataflow-ai:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
